
# Mantém dependências (Go, npm e GitHub Actions) atualizadas automaticamente.
# Semanalmente, PRs são abertos com revisão automática (reviewers).
#
# ⚠️ Auto-merge NÃO é configurado aqui: ele não é uma chave suportada do
#    dependabot.yml (as chaves `auto_merge`/`pull_request_review_rule` são
#    inválidas e quebram a validação). O auto-merge nativo do Dependabot é
#    configurado na UI do GitHub: Settings → Dependabot → Automations
#    (escolha os update-types, ex.: minor+patch, que serão auto-merged após o
#    workflow "PR Checks" passar). Veja docs/branch-protection-main.md.
#
# Confira o nome em `reviewers`: "giovbon" é um palpite a partir do dono da
#    imagem Docker (giovbon/ton618_core). Troque pelo seu usuário se for outro.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "giovbon"
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "npm"
    directory: "/core/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    reviewers:
      - "giovbon"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "npm"
    directory: "/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "giovbon"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "npm"
    directory: "/core/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "giovbon"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "giovbon"
    labels:
      - "dependencies"
      - "github-actions"
