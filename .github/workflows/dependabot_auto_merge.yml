# Auto-merge seguro dos PRs do Dependabot.
#
# O Dependabot NÃO possui auto-merge por chave de configuração (auto_merge /
# pull_request_review_rule não existem em dependabot.yml). O padrão oficial da
# documentação do GitHub é este workflow: ele detecta um PR do Dependabot e
# "habilita auto-merge" no PR (gh pr merge --auto). O GitHub então mergeia o PR
# automaticamente assim que os checks obrigatórios (PR Checks → "Test (Go + Web)")
# passarem — por isso a proteção da `main` (docs/branch-protection-main.md) é o
# que garante a segurança.
#
# Pré-requisitos:
#   - Habilitar "Allow auto-merge" no repo: Settings → General → Pull Requests
#     → marcar "Allow auto-merge".
#   - Proteger a `main` exigindo o check "Test (Go + Web)" antes do merge
#     (para os auto-merged só acontecerem após os testes passarem).
#
# Escopo: só minor + patch (update-type version-update:semver-minor/patch).
# Majors NÃO são auto-merged — exigem revisão humana.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs (minor + patch, exceto sensíveis)
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          !contains(steps.metadata.outputs.dependency-names, '@tiptap/') &&
          !contains(steps.metadata.outputs.dependency-names, 'github.com/a-h/templ')
        # Exclui do auto-merge: @tiptap/* (ecossistema que exige bump em lockstep —
        # atualizacão parcial quebrou o build) e github.com/a-h/templ (gera os
        # *_templ.go gitignored; bump desalinhado quebra o build Go). Esses seguem
        # para revisão humana.
        # Usa --squash (e não --merge): a proteção da branch `main` (ex.:
        # "Require linear history") bloqueia merge commits, então --merge falhava
        # com "Merge method merge commits are not allowed". Squash é compatível.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: "${{ github.event.pull_request.html_url }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
