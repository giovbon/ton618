name: Deploy do Core no Docker Hub e APK Android

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag manual (opcional, deixe vazio para auto-incrementar)"
        required: false
        default: ""
      mode:
        description: "Modo de build Docker: 1 = ARM64, 2 = AMD64 + ARM64"
        required: false
        default: "2"

env:
  IMAGE_NAME: giovbon/ton618_core

jobs:
  test:
    name: Test (Go + Web)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: core/go.sum

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            core/package-lock.json
            core/web/package-lock.json

      - name: 📦 Instalar deps do core (chrono-node p/ teste de agenda)
        working-directory: ./core
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: 🔨 Gerar templates Templ
        working-directory: ./core
        run: |
          TEMPL_REQ="$(grep -E 'github.com/a-h/templ[[:space:]]' go.mod | awk '{print $2}' | head -n1 || true)"
          if [ -n "$TEMPL_REQ" ]; then
            go run github.com/a-h/templ/cmd/templ@"$TEMPL_REQ" generate
          else
            go run github.com/a-h/templ/cmd/templ@latest generate
          fi

      - name: 🧪 Testes Go
        working-directory: ./core
        run: go test ./...

      - name: 🎨 Verificar formatação (gofmt)
        working-directory: ./core
        run: |
          UNFORMATTED="$(gofmt -l cmd internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Arquivos fora do gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: 🩺 go vet
        working-directory: ./core
        run: go vet ./...

      - name: 🟢 Instalar deps do web
        working-directory: ./core/web
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          NODE_OPTIONS: "--no-network-family-autoselection"
        run: npm ci --legacy-peer-deps

      - name: 🧪 Typecheck do frontend (tsc --noEmit)
        working-directory: ./core/web
        run: npm run typecheck

  bump-version:
    name: 🏷️ Auto Version Bump
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 📥 Checkout com histórico de tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔢 Calcular Próxima Versão
        id: version
        run: |
          # 1. Se foi informado manualmente via workflow_dispatch
          if [ -n "${{ inputs.tag }}" ]; then
            echo "Usando tag manual informada: ${{ inputs.tag }}"
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Se o push já foi uma tag git (ex: git push origin v2.1.0)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
            echo "Usando tag do evento push: $CURRENT_TAG"
            echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Auto-incremento para pushes na branch main
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.0.0")
          echo "Última versão encontrada: $LAST_TAG"

          CLEAN_VER="${LAST_TAG#v}"
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)

          # Trata caso a tag não siga exatamente major.minor.patch
          MAJOR="${MAJOR:-2}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"

          # Incrementa o número do patch
          PATCH=$((PATCH + 1))

          # Se o PATCH atingir 30 commits, incrementa o MINOR e zera o PATCH
          if [ "$PATCH" -ge 30 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Nova versão calculada: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

          # Configura autor e cria tag no repositório
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG [skip ci]"
          git push origin "$NEW_TAG"

  deploy:
    name: Build & Push Docker
    needs: [test, bump-version]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: core/web/package-lock.json

      - name: 🧪 Rodar testes unitários JS
        working-directory: ./core/web
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          NODE_OPTIONS: "--no-network-family-autoselection"
        run: |
          npm ci --legacy-peer-deps
          npm test

      - name: 🔧 Setup QEMU (binfmt)
        uses: docker/setup-qemu-action@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Definir plataformas
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "1" ]; then
            echo "platforms=linux/arm64" >> $GITHUB_OUTPUT
            echo "mode=Apenas ARM64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
            echo "mode=Multi-Arch (AMD64 + ARM64)" >> $GITHUB_OUTPUT
          fi

      - name: 🔨 Build e Push
        uses: docker/build-push-action@v7
        with:
          context: ./core
          file: ./core/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.bump-version.outputs.tag }},${{ env.IMAGE_NAME }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: ✅ Summary
        run: |
          echo "## 🐳 Deploy Docker concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ needs.bump-version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Plataformas** | ${{ steps.platforms.outputs.platforms }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| **Modo** | ${{ steps.platforms.outputs.mode }} \vert{}" >> $GITHUB_STEP_SUMMARY

  android-apk:
    name: Build Android APK & Release
    needs: [test, bump-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: core/go.sum

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: core/web/package-lock.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: 🌐 Compilar bundle web
        working-directory: ./core/web
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          NODE_OPTIONS: "--no-network-family-autoselection"
        run: |
          npm ci --legacy-peer-deps
          node build.js

      - name: 🔨 Gerar templates Templ
        working-directory: ./core
        run: |
          TEMPL_REQ="$(grep -E 'github.com/a-h/templ[[:space:]]' go.mod | awk '{print $2}' | head -n1 || true)"
          if [ -n "$TEMPL_REQ" ]; then
            go run github.com/a-h/templ/cmd/templ@"$TEMPL_REQ" generate
          else
            go run github.com/a-h/templ/cmd/templ@latest generate
          fi

      - name: 🤖 Compilar Core Go para Android ARM64
        working-directory: ./core
        run: |
          # build-core-arm64.sh é a fonte única de verdade do empacotamento Android:
          # binário só em jniLibs (não duplica em assets/), assets copiados
          # RECURSIVAMENTE (js/, fonts/) sem .gz/.br e sem onnxruntime, e falha
          # explícita se algum asset essencial faltar.
          bash ../android/build-core-arm64.sh
          ls -lh ../android/app/src/main/jniLibs/arm64-v8a/libton618.so
          du -sh ../android/app/src/main/assets/web/static

      - name: 📱 Compilar APK com Gradle
        working-directory: ./android
        run: gradle assembleDebug

      - name: 📦 Preparar nome do APK
        id: apk_info
        run: |
          TAG_VAL="${{ needs.bump-version.outputs.tag }}"
          APK_FILE="ton618-${TAG_VAL}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_FILE" >> $GITHUB_OUTPUT

      - name: 📤 Disponibilizar APK como Artifact da Action
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_info.outputs.apk_name }}
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 30

      - name: 🚀 Criar / Atualizar Release no GitHub com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: "TON-618 ${{ needs.bump-version.outputs.tag }}"
          files: ${{ steps.apk_info.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Summary APK
        run: |
          echo "## 📱 Android APK & Release Publicados!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Versão** | \`${{ needs.bump-version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Arquivo APK** | \`${{ steps.apk_info.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Download direto** | Disponível na aba **Releases** do repositório |" >> $GITHUB_STEP_SUMMARY