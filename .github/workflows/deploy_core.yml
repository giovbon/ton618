name: Deploy do Core no Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag manual (opcional, deixe vazio para auto-incrementar)"
        required: false
        default: ""
      mode:
        description: "Modo de build Docker: 1 = ARM64, 2 = AMD64 + ARM64"
        required: false
        default: "2"

env:
  IMAGE_NAME: giovbon/ton618_core

jobs:
  test:
    name: Test (Go + Web)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: core/go.sum

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            core/package-lock.json
            core/web/package-lock.json

      - name: 📦 Instalar deps do core (chrono-node p/ teste de agenda)
        working-directory: ./core
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: 🔨 Gerar templates Templ
        working-directory: ./core
        run: |
          TEMPL_REQ="$(grep -E 'github.com/a-h/templ[[:space:]]' go.mod | awk '{print $2}' | head -n1 || true)"
          if [ -n "$TEMPL_REQ" ]; then
            go run github.com/a-h/templ/cmd/templ@"$TEMPL_REQ" generate
          else
            go run github.com/a-h/templ/cmd/templ@latest generate
          fi

      - name: 📦 go mod tidy (depois do templ generate)
        working-directory: ./core
        run: go mod tidy

      - name: 🧪 Testes Go
        working-directory: ./core
        run: go test ./...

      - name: 🎨 Verificar formatação (gofmt)
        working-directory: ./core
        run: |
          UNFORMATTED="$(gofmt -l cmd internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Arquivos fora do gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: 🩺 go vet
        working-directory: ./core
        run: go vet ./...

      - name: 🟢 Instalar deps do web
        working-directory: ./core/web
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          NODE_OPTIONS: "--no-network-family-autoselection"
        run: npm ci --legacy-peer-deps

      - name: 🧪 Typecheck do frontend (tsc --noEmit)
        working-directory: ./core/web
        run: npm run typecheck

  bump-version:
    name: 🏷️ Auto Version Bump
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      bump: ${{ steps.version.outputs.bump }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: 📥 Checkout com histórico de tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔢 Calcular Próxima Versão (SemVer via Conventional Commits)
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "Usando tag manual informada: ${{ inputs.tag }}"
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            echo "bump=manual" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
            echo "Usando tag do evento push: $CURRENT_TAG"
            echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
            echo "bump=manual" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Última versão encontrada: $LAST_TAG"

          CLEAN_VER="${LAST_TAG#v}"
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)

          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"

          if git rev-parse -q --verify "refs/tags/${LAST_TAG}" >/dev/null 2>&1; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          SUBJECTS="$(git log "$RANGE" --format='%s' 2>/dev/null || true)"
          COMMITS="$(git log "$RANGE" --format='%s%n%b' 2>/dev/null || true)"

          NONREL='^(chore|docs|ci|test|style|build)(\([^)]*\))?!?:|^bump |^merge '
          if [ -n "$SUBJECTS" ] && printf '%s\n' "$SUBJECTS" | grep -qviE "$NONREL"; then
            RELEASE="true"
          else
            RELEASE="false"
          fi
          echo "Gera release? $RELEASE"
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

          if [ "$RELEASE" != "true" ]; then
            echo "Sem mudanças releasable desde ${LAST_TAG} — nenhuma tag criada."
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if printf '%s\n' "$COMMITS" | grep -qiE 'BREAKING[ -]CHANGE|^[a-z]+(\([^)]*\))?!:'; then
            BUMP="major"
          elif printf '%s\n' "$SUBJECTS" | grep -qiE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          echo "Tipo de bump detectado: $BUMP"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Nova versão calculada: $NEW_TAG"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG [skip ci]"
          git push origin "$NEW_TAG"

  deploy:
    name: Build & Push Docker
    needs: [test, bump-version]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: core/go.sum

      - name: 🔨 Gerar templates Templ
        working-directory: ./core
        run: |
          TEMPL_REQ="$(grep -E 'github.com/a-h/templ[[:space:]]' go.mod | awk '{print $2}' | head -n1 || true)"
          if [ -n "$TEMPL_REQ" ]; then
            go run github.com/a-h/templ/cmd/templ@"$TEMPL_REQ" generate
          else
            go run github.com/a-h/templ/cmd/templ@latest generate
          fi

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: core/web/package-lock.json

      - name: 🧪 Rodar testes unitários e Build JS
        working-directory: ./core/web
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          NODE_OPTIONS: "--no-network-family-autoselection"
        run: |
          npm ci --legacy-peer-deps
          node build.js
          npm test

      - name: 🔧 Setup QEMU (binfmt)
        uses: docker/setup-qemu-action@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Definir plataformas
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "1" ]; then
            echo "platforms=linux/arm64" >> $GITHUB_OUTPUT
            echo "mode=Apenas ARM64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
            echo "mode=Multi-Arch (AMD64 + ARM64)" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Definir tags da imagem
        id: imagetags
        run: |
          if [ -n "${{ needs.bump-version.outputs.tag }}" ]; then
            echo "tags=${IMAGE_NAME}:${{ needs.bump-version.outputs.tag }},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          fi

      - name: 🔨 Build e Push
        uses: docker/build-push-action@v7
        with:
          context: ./core
          file: ./core/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          tags: ${{ steps.imagetags.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: ✅ Summary
        run: |
          echo "## 🐳 Deploy Docker concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ needs.bump-version.outputs.tag || 'latest (sem release)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bump** | \`${{ needs.bump-version.outputs.bump }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Plataformas** | ${{ steps.platforms.outputs.platforms }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| **Modo** | ${{ steps.platforms.outputs.mode }} \vert{}" >> $GITHUB_STEP_SUMMARY
