services:
  ton618-pkm:
    image: giovbon/ton618plus:latest
    container_name: ton618
    restart: unless-stopped
    user: root
    ports:
      - "6180:6180"
    environment:
      - DOCS_DIR=/app/docs
      - DB_PATH=/app/data/ton618.db
      - STATE_DIR=/app/data
      - WEB_DIR=/app/web
      - PORT=6180
      - POLL_INTERVAL_SEC=30
      # Workers da indexação inicial (0 = automático: GOMAXPROCS, máx 4).
      # Em ARMv7 (ex: Raspberry Pi 4 núcleos) 2–4 costuma ser o ideal; 1 = sequencial.
      - SCAN_WORKERS=0
      # Precisão dos lembretes ntfy da agenda (segundos entre polls; padrão 60).
      # Menor = mais previsível ("X horas antes do evento"), maior = menos consultas ao banco.
      - NTFY_POLL_INTERVAL_SEC=60
      - AUTH_USER=admin
      - AUTH_PASS=ton618_secret
      - TZ=America/Sao_Paulo
    volumes:
      - ./docs:/app/docs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6180/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Limites conservadores para Raspberry Pi (ajuste conforme o modelo)
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
